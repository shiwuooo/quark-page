<!DOCTYPE html>
<html>
<head>
    <title>领取</title>
    <script>
        // 检测是否为手机设备 [16]()
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent); 
        }
 
        window.onload  = function() {
            if (isMobile()) {
                // 手机直接跳转夸克链接（替换成你的实际链接）
                window.location.href  = "https://pan.quark.cn/s/bc67673444a8";
            } else {
                // 非手机显示二维码 
                document.getElementById("qrcode").style.display  = "block";
            }
        }
    </script>
    <style>
        body { text-align: center; margin-top: 50px; }
        #qrcode { display: none; }
    </style>
</head>
<body>
    <div id="qrcode">
        <p>请用手机扫描网盘二维码保存领取</p>
        <!-- 替换成你的夸克链接二维码图片地址 -->
        <img src="https://s3.bmp.ovh/imgs/2025/05/01/3634aea5b90f1aac.png" width="200">
    </div>
</body>
</html>
